<section class="dashboard">

  <div class="dashboard-header">
    <h1>Tu mesa de aventura</h1>
    <p>Accede a las herramientas de GrimoireLink.</p>
  </div>

  <section class="tools-section">

    <h2>Herramientas de tu mesa</h2>

    <div class="tools-grid">

      @for (tool of tools; track tool.route) {

        <article class="tool-card">

          <h3>{{ tool.title }}</h3>

          <p>{{ tool.description }}</p>

          <a [routerLink]="tool.route" class="tool-link">
            {{ tool.action }}
          </a>

        </article>
      }
    </div>
  </section>
</section>
